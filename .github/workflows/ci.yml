name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Elixir ${{ matrix.pair.elixir }} / OTP ${{ matrix.pair.otp }}
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: test
      # Run the wireguard-go interop tests, and fail if Go is missing.
      WAGYU_INTEROP: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        pair:
          - {elixir: "1.20", otp: "29"}
          - {elixir: "1.20", otp: "28"}
          - {elixir: "1.20", otp: "27"}
          - {elixir: "1.19", otp: "28"}
          - {elixir: "1.19", otp: "27"}
          - {elixir: "1.18", otp: "27"}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: ${{ matrix.pair.otp }}
          elixir-version: ${{ matrix.pair.elixir }}

      - name: Set up Go for the interop tests
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: test/interop/go.mod
          cache-dependency-path: test/interop/go.sum

      - name: Restore dependencies and build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-elixir-${{ matrix.pair.elixir }}-otp-${{ matrix.pair.otp }}-mix-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elixir-${{ matrix.pair.elixir }}-otp-${{ matrix.pair.otp }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run precommit checks
        run: mix precommit
